<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudOS - Linux & Windows Hybrid</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    #desktop {
      width: 100vw;
      height: calc(100vh - 48px);
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .icon {
      width: 80px;
      text-align: center;
      color: white;
      cursor: pointer;
      margin-bottom: 20px;
      text-shadow: 0px 1px 3px rgba(0,0,0,0.8);
    }
    .icon img { width: 48px; height: 48px; display: block; margin: 0 auto 5px; }
    .icon:hover { background: rgba(255, 255, 255, 0.1); border-radius: 8px; }

    /* VENTANA MÓVIL Y ARRASTRABLE */
    .window {
      position: absolute;
      top: 50px; left: 100px;
      width: 80%; height: 80%;
      background: #1e1e1e;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      resize: both;
      z-index: 100;
    }

    .window-header {
      height: 35px;
      background: #2d2d2d;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      cursor: move; /* Indica que la barra es arrastrable */
    }
    .window-controls span {
      display: inline-block;
      width: 12px; height: 12px;
      border-radius: 50%;
      margin-left: 6px;
      cursor: pointer;
    }
    .close-btn { background: #ff5f56; }
    .min-btn { background: #ffbd2e; }
    .max-btn { background: #27c93f; }

    .window-content { 
      flex: 1; 
      width: 100%; 
      height: 100%; 
      background: #000; 
      position: relative;
    }
    iframe { width: 100%; height: 100%; border: none; }

    /* Máscara invisible para evitar interferencia del iframe durante el arrastre */
    .drag-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: none;
      z-index: 10;
    }

    #taskbar {
      height: 48px;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      padding: 0 15px;
      position: absolute;
      bottom: 0; width: 100%;
      z-index: 1000;
    }
    .start-btn {
      background: #0078d4;
      color: white;
      padding: 6px 14px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .start-btn:hover { background: #106ebe; }
  </style>
</head>
<body>

  <div id="desktop">
    <div class="icon" onclick="openLinuxWindow()">
      <img src="https://cdn-icons-png.flaticon.com/512/518/518713.png" alt="Linux">
      <span>Linux OS</span>
    </div>
  </div>

  <div id="linuxWindow" class="window" style="display:none;">
    <div id="linuxWindowHeader" class="window-header">
      <div style="display:flex; align-items:center; gap:8px;">
        <img src="https://cdn-icons-png.flaticon.com/512/518/518713.png" width="16">
        <span>Ubuntu / Linux Webtop</span>
      </div>
      <div class="window-controls">
        <span class="min-btn"></span>
        <span class="max-btn"></span>
        <span class="close-btn" onclick="closeLinuxWindow()"></span>
      </div>
    </div>
    <div class="window-content">
      <div id="dragOverlay" class="drag-overlay"></div>
      <iframe id="linuxFrame" src="about:blank"></iframe>
    </div>
  </div>

  <div id="taskbar">
    <div class="start-btn" onclick="openLinuxWindow()">
       Inicio
    </div>
  </div>

  <script>
    // Asegúrate de reemplazar esta URL con la que te dio Render
    const LINUX_SERVER_URL = "https://mi-linux-backend.onrender.com"; 

    function openLinuxWindow() {
      const win = document.getElementById('linuxWindow');
      const iframe = document.getElementById('linuxFrame');
      win.style.display = 'flex';
      if (iframe.src === "about:blank") {
        iframe.src = LINUX_SERVER_URL;
      }
    }

    function closeLinuxWindow() {
      document.getElementById('linuxWindow').style.display = 'none';
    }

    // LÓGICA DRAG & DROP
    makeElementDraggable(document.getElementById("linuxWindow"), document.getElementById("linuxWindowHeader"));

    function makeElementDraggable(elmnt, header) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
      const overlay = document.getElementById("dragOverlay");

      if (header) {
        header.onmousedown = dragMouseDown;
      }

      function dragMouseDown(e) {
        e = e || window.event;
        e.preventDefault();
        pos3 = e.clientX;
        pos4 = e.clientY;
        overlay.style.display = "block"; // Activa la máscara para mantener suavidad en el iframe

        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
      }

      function elementDrag(e) {
        e = e || window.event;
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
        elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
      }

      function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
        overlay.style.display = "none";
      }
    }
  </script>
</body>
</html>
